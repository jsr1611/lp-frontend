<div class="login-container">
  <h2>{{ 'auth.login' | translate }}</h2>
  <form (ngSubmit)="login()">
    <div class="form-group">
      <label for="username">{{ 'auth.username' | translate }}:</label>
      <input type="text" id="username" [(ngModel)]="username" name="username" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="password">{{ 'auth.password' | translate }}:</label>
      <input type="password" id="password" [(ngModel)]="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">{{ 'auth.login' | translate }}</button>
    @if (errorMessage) {
      <div class="alert alert-danger mt-2">{{ errorMessage }}</div>
    }
  </form>
  <p class="mt-3 d-flex justify-content-center"><a routerLink="/reset-password">{{ 'auth.forgotPassword' | translate }}</a> <a class="ms-2" routerLink="/signup">{{ 'auth.createAccount' | translate }}</a></p>

</div>
