<section class="downloader">
    <div class="noise" aria-hidden="true"></div>
    <main class="page">
        <header class="hero">
            <h1>{{ 'downloader.title' | translate }}</h1>
            <p class="lead">
                {{ 'downloader.lead' | translate }}
            </p>
        </header>

        <section class="card">
            <label class="field">
                <span>{{ 'downloader.videoUrl' | translate }}</span>
                <input type="url" name="videoUrl"
                    [attr.placeholder]="'downloader.urlPlaceholder' | translate"
                    autocomplete="off" [(ngModel)]="videoUrl" (input)="onUrlChange()"
                    [attr.aria-invalid]="videoUrl && !isValidUrl ? 'true' : 'false'" required />
            </label>

            <div class="row">
                <label class="toggle">
                    <input type="checkbox" name="convertToMp3" [(ngModel)]="convertToMp3" />
                    <span>{{ 'downloader.convertToMp3' | translate }}</span>
                </label>

                <button type="button" (click)="download()" [disabled]="isSubmitting || !isValidUrl">
                    {{ 'downloader.download' | translate }}
                </button>
            </div>

            <div class="status" role="status" aria-live="polite">
                {{ statusKey | translate }}
            </div>
        </section>

        <section class="tips">
            <div>
                <h2>{{ 'downloader.proTipTitle' | translate }}</h2>
                <p>
                    {{ 'downloader.proTip' | translate }}
                </p>
            </div>
            <div class="pill">{{ 'downloader.backendPill' | translate }}</div>
        </section>
    </main>
</section>
