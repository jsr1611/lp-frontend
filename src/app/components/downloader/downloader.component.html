<section class="downloader">
    <div class="noise" aria-hidden="true"></div>
    <main class="page">
        <header class="hero">
            <h1>Download YouTube/Instagram clips without the fuss.</h1>
            <p class="lead">
                Paste a link, pick your format, and the file drops straight to your
                machine.
            </p>
        </header>

        <section class="card">
            <label class="field">
                <span>Video URL</span>
                <input type="url" name="videoUrl"
                    placeholder="https://www.youtube.com/watch?v=... or https://www.instagram.com/reel/..."
                    autocomplete="off" [(ngModel)]="videoUrl" (input)="onUrlChange()"
                    [attr.aria-invalid]="videoUrl && !isValidUrl ? 'true' : 'false'" required />
            </label>

            <div class="row">
                <label class="toggle">
                    <input type="checkbox" name="convertToMp3" [(ngModel)]="convertToMp3" />
                    <span>Convert to MP3</span>
                </label>

                <button type="button" (click)="download()" [disabled]="isSubmitting || !isValidUrl">
                    Download
                </button>
            </div>

            <div class="status" role="status" aria-live="polite">
                {{ status }}
            </div>
        </section>

        <section class="tips">
            <div>
                <h2>Pro tip</h2>
                <p>
                    Want a quick audio rip? Toggle MP3 and keep the browser tab open
                    until the download starts.
                </p>
            </div>
            <div class="pill">FastAPI backend</div>
        </section>
    </main>
</section>
