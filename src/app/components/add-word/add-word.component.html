<h2>{{ 'addWord.title' | translate }}: @if (successMsg.length > 0) {
  <span>{{successMsg}}</span>
}</h2>
<div class="container">
  <form (ngSubmit)="addWord()" #wordForm="ngForm">
    <div class="form-group">
      <label for="pronunciation">{{ 'addWord.pronunciation' | translate }}:</label>
      <input
        id="pronunciation"
        name="pronunciation"
        [(ngModel)]="newWord.pronunciation"
        type="text"
        class="form-control"
        [attr.placeholder]="'addWord.pronunciationPlaceholder' | translate"
        required
        />
      </div>

      <div class="form-group">
        <label for="arabic">{{ 'addWord.arabic' | translate }}:</label>
        <input
          id="arabic"
          name="arabic"
          [(ngModel)]="newWord.arabic"
          type="text"
          class="form-control word-arabic"
          [attr.placeholder]="'addWord.arabicPlaceholder' | translate"
          required
          />
        </div>

        <div class="form-group">
          <label for="uzbek">{{ 'addWord.meaning' | translate }}:</label>
          <input
            id="uzbek"
            name="uzbek"
            [(ngModel)]="newWord.uzbek"
            type="text"
            class="form-control"
            [attr.placeholder]="'addWord.meaningPlaceholder' | translate"
            required
            />
          </div>

          <div class="form-group">
            <label for="english">{{ 'addWord.english' | translate }}:</label>
            <input
              id="english"
              name="english"
              [(ngModel)]="newWord.english"
              type="text"
              class="form-control"
              [attr.placeholder]="'addWord.englishPlaceholder' | translate"
              />
            </div>

            <div class="form-group">
              <label for="category">{{ 'addWord.category' | translate }}:</label>
              <select
                id="category"
                name="category"
                [(ngModel)]="newWord.category"
                class="form-control"
                required
                >
                @for (category of categories; track category) {
                  <option [value]="category">
                    {{ categoryLabels[category] | translate }}
                  </option>
                }
              </select>
            </div>
            <div class="form-group">
              <label for="remark">{{ 'addWord.remark' | translate }}:</label>
              <input
                id="remark"
                name="remark"
                [(ngModel)]="newWord.remark"
                type="text"
                class="form-control"
                [attr.placeholder]="'addWord.remarkPlaceholder' | translate"
                />
              </div>

              <button type="submit" class="btn btn-primary">{{ 'common.save' | translate }}</button>
            </form>

            <hr>

              <a href="/words" class="btn btn-secondary">{{ 'addWord.viewWords' | translate }}</a>
            </div>
