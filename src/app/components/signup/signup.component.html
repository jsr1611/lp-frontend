<div class="signup-container">
  <h2>{{ 'auth.signup' | translate }}</h2>
  <form (ngSubmit)="signup()">
    <div class="form-group">
      <label for="firstname">{{ 'auth.firstname' | translate }}:</label>
      <input type="text" id="firstname" [(ngModel)]="user.firstname" name="firstname" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="lastname">{{ 'auth.lastname' | translate }}:</label>
      <input type="text" id="lastname" [(ngModel)]="user.lastname" name="lastname" class="form-control">
    </div>
    <div class="form-group">
      <label for="username">{{ 'auth.username' | translate }}:</label>
      <input type="text" id="username" [(ngModel)]="user.username" name="username" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="email">{{ 'auth.email' | translate }}:</label>
      <input type="email" id="email" [(ngModel)]="user.email" name="email" class="form-control" required>
    </div>
    <div class="form-group">
      <label for="password">{{ 'auth.password' | translate }}:</label>
      <input type="password" [(ngModel)]="user.password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">{{ 'auth.signup' | translate }}</button>
    <a class="btn btn-primary" routerLink="/login">{{ 'auth.login' | translate }}</a>
    @if (errorMessage) {
      <div class="alert alert-danger mt-2">{{ errorMessage }}</div>
    }
    @if (successMessage) {
      <div class="alert alert-danger mt-2">{{ successMessage }}</div>
    }
  </form>
</div>
